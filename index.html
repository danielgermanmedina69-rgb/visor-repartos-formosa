<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#121212">
  <title>Logística Dark Mode · Formosa</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
  <style>
    :root { 
      --bg: #121212; 
      --panel: #1e1e1e; 
      --accent: #007acc; 
      --ink: #e0e0e0; 
      --muted: #aaa; 
    }
    * { box-sizing: border-box; }
    html, body { 
      margin: 0; 
      height: 100%; 
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; 
      background: var(--bg); 
      color: var(--ink); 
    }
    body { display: flex; flex-direction: column; }
    header { padding: 10px 14px; background: var(--bg); border-bottom: 1px solid #333; }
    h1 { font-size: 16px; margin: 0 0 2px; letter-spacing: .2px; }
    .sub { color: var(--muted); font-size: 11px; }
    
    .controls { padding: 10px 12px; background: var(--panel); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; border-bottom: 1px solid #333; }
    .search-row { display: flex; gap: 7px; width: 100%; }
    input { 
      min-width: 0; 
      flex: 1; 
      border: 1px solid #444; 
      border-radius: 6px; 
      padding: 9px 12px; 
      font-size: 14px; 
      background: #2d2d2d; 
      color: #fff; 
      outline: none;
    }
    input:focus { border-color: var(--accent); }
    button { 
      border: 0; 
      border-radius: 6px; 
      padding: 9px 12px; 
      font-weight: 700; 
      font-size: 13px; 
      background: var(--accent); 
      color: #fff; 
      cursor: pointer; 
      transition: background 0.2s;
    }
    button:hover { background: #0098ff; }
    .btn-secondary { background: #6c757d; }
    .btn-secondary:hover { background: #5a6268; }
    .btn-cancel { background: #d9534f; }
    .btn-cancel:hover { background: #c9302c; }
    .btn-ruta { margin-top: 8px; width: 100%; background: #28a745; color: white; padding: 6px; border-radius: 4px; }
    .btn-ruta:hover { background: #218838; }

    .actions { display: flex; gap: 7px; flex-wrap: wrap; width: 100%; align-items: center; justify-content: space-between; }
    #status { font-size: 12px; color: var(--muted); line-height: 1.4; width: 100%; }
    
    #map { flex: 1; min-height: 280px; width: 100%; background: #1a1a1a; }
    footer { background: var(--bg); color: var(--muted); font-size: 10px; padding: 6px 12px; border-top: 1px solid #222; }
    
    /* Estilos Leaflet oscuros personalizados */
    .leaflet-control-layers { background: var(--panel) !important; color: var(--ink) !important; border: 1px solid #444 !important; border-radius: 8px !important; }
    .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: #222 !important; color: #fff !important; border-radius: 6px; }
    .leaflet-routing-container { background-color: #1e1e1e !important; color: #e0e0e0 !important; border-radius: 6px; padding: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    .leaflet-routing-alt { max-height: 150px; overflow-y: auto; background-color: #2d2d2d !important; color: #e0e0e0 !important; }
    
    .gps-dot { 
      width: 18px; 
      height: 18px; 
      border-radius: 50%; 
      background: #007acc; 
      border: 3px solid white; 
      box-shadow: 0 1px 7px #000; 
    }
    @media (min-width: 700px) { 
      body { 
        max-width: 950px; 
        margin: auto; 
        height: 100dvh; 
        border-left: 1px solid #333; 
        border-right: 1px solid #333; 
      } 
    }
  </style>
</head>
<body>
  <header>
    <h1>🧭 Logística Dark Mode · Formosa</h1>
    <div class="sub">Catastro provincial IDEF + Filtros de repartos + Navegación OSRM</div>
  </header>
  
  <section class="controls">
    <!-- Filtros de tu base de datos de repartos -->
    <div class="search-row">
      <input type="text" id="filter-barrio" placeholder="Filtrar por Barrio...">
      <input type="text" id="filter-calle" placeholder="Filtrar por Calle o Altura...">
      <button onclick="filtrarUbicaciones()">Buscar</button>
    </div>
    
    <!-- Buscador general de direcciones (Georef / Nominatim) -->
    <div class="search-row">
      <input id="address" type="search" placeholder="Dirección exacta (ej. San Martín 150)...">
      <button id="searchBtn" class="btn-secondary">Geo-buscar</button>
    </div>

    <div class="actions">
      <div>
        <button id="locateBtn">📍 Mi Ubicación</button>
        <button id="stopBtn" class="btn-cancel">Pausar GPS</button>
      </div>
      <button class="btn-cancel" onclick="cancelarRuta()">Cancelar Ruta</button>
    </div>
    <div id="status">Ingresá un filtro, buscá una dirección o tocá el mapa.</div>
  </section>
  
  <main id="map"></main>
  
  <footer>
    Catastro IDEF / DGCT Formosa. Enrutamiento libre OSRM y OpenStreetMap.
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.min.js"></script>
  <script>
    const statusBox = document.getElementById('status');
    const map = L.map('map', { zoomControl: true }).setView([-26.1852, -58.1751], 14);

    // Mapa base oscuro o callejero adaptado
    const streets = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 20, 
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    // Capas WMS de Catastro de Formosa (IDEF)
    const wmsUrl = 'https://idef.formosa.gob.ar/servicios/wms';
    function cadastralLayer(name) {
      const layer = L.tileLayer.wms(wmsUrl, {
        layers: name, 
        format: 'image/png', 
        transparent: true,
        version: '1.1.1', 
        opacity: 0.75, 
        tiled: true
      });
      layer.on('tileerror', () => {
        statusBox.textContent = 'Aviso: Servidor catastral IDEF inactivo temporalmente. El mapa sigue operativo.';
      });
      return layer;
    }
    
    const blocks = cadastralLayer('dgct:cat_prov_manzanas');
    const parcels = cadastralLayer('dgct:dgct_prov_parurbanas');
    const roadNames = cadastralLayer('dgct:prov_calles');
    
    const overlays = {
      'Manzanas (Catastro)': blocks,
      'Parcelas urbanas': parcels,
      'Calles catastrales': roadNames
    };
    L.control.layers({ 'Mapa base': streets }, overlays, { collapsed: false }).addTo(map);
    blocks.addTo(map);

    // Base de datos local de entregas/repartos (puedes agregar más aquí)
    const baseDeDatos = [
      { id: 1, barrio: "Centro", calle: "San Martín 123", lat: -26.1822, lng: -58.1731 },
      { id: 2, barrio: "Don Bosco", calle: "Belgrano 456", lat: -26.1950, lng: -58.1810 },
      { id: 3, barrio: "Independencia", calle: "Eva Perón 789", lat: -26.1750, lng: -58.1650 }
    ];

    // Variables de navegación y GPS
    let watchId = null;
    let gpsMarker = null;
    let accuracyCircle = null;
    let currentCoords = null;
    let routeLayer = null;
    let targetMarker = null;
    let routingControl = null;
    let currentSteps = [];
    let lastSpokenInstruction = '';
    const gpsIcon = L.divIcon({ className: '', html: '<div class="gps-dot"></div>', iconSize: [18, 18], iconAnchor: [9, 9] });
    let markersLayer = L.layerGroup().addTo(map);

    // Síntesis de voz (Text-to-Speech)
    function speak(text) {
      if (!('speechSynthesis' in window)) return;
      if (text === lastSpokenInstruction) return;
      lastSpokenInstruction = text;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'es-AR';
      utterance.rate = 1.0;
      window.speechSynthesis.speak(utterance);
    }

    function translateManeuver(step) {
      const type = step.maneuver.type;
      const modifier = step.maneuver.modifier;
      const name = step.name ? ` en ${step.name}` : '';
      switch (type) {
        case 'depart': return `Iniciá la marcha${name}.`;
        case 'arrive': return `Llegaste a tu destino.`;
        case 'turn':
          if (modifier === 'left') return `Girá a la izquierda${name}.`;
          if (modifier === 'right') return `Girá a la derecha${name}.`;
          break;
        case 'continue': return `Continuá derecho${name}.`;
      }
      return `Continuá por${name}.`;
    }

    // Actualización de ubicación GPS
    function showPosition(pos) {
      const lat = pos.coords.latitude, lon = pos.coords.longitude;
      const accuracy = pos.coords.accuracy || 25;
      currentCoords = [lat, lon];
      
      if (!gpsMarker) {
        gpsMarker = L.marker([lat, lon], { icon: gpsIcon, zIndexOffset: 1000 }).addTo(map).bindPopup('Tu ubicación GPS');
        accuracyCircle = L.circle([lat, lon], { radius: accuracy, color: '#007acc', weight: 1, fillOpacity: .15 }).addTo(map);
        map.setView([lat, lon], 16);
      } else {
        gpsMarker.setLatLng([lat, lon]);
        accuracyCircle.setLatLng([lat, lon]).setRadius(accuracy);
      }
      
      if (window.lastTarget) {
        checkNavigationSteps(lat, lon);
      }
    }

    function checkNavigationSteps(lat, lon) {
      if (!currentSteps || currentSteps.length === 0) return;
      const nextStep = currentSteps[0];
      const stepCoord = [nextStep.maneuver.location[1], nextStep.maneuver.location[0]];
      const dist = map.distance([lat, lon], stepCoord);
      if (dist < 40) {
        speak(translateManeuver(nextStep));
        currentSteps.shift();
      }
    }

    document.getElementById('locateBtn').addEventListener('click', () => {
      if (!('geolocation' in navigator)) {
        statusBox.textContent = 'Geolocalización no disponible en este navegador.';
        return;
      }
      if (watchId !== null) navigator.geolocation.clearWatch(watchId);
      statusBox.textContent = 'Buscando señal GPS...';
      watchId = navigator.geolocation.watchPosition(showPosition, () => {
        statusBox.textContent = 'No se pudo obtener ubicación. Verificá los permisos.';
      }, { enableHighAccuracy: true, maximumAge: 3000, timeout: 20000 });
    });

    document.getElementById('stopBtn').addEventListener('click', () => {
      if (watchId !== null) navigator.geolocation.clearWatch(watchId);
      watchId = null;
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      statusBox.textContent = 'GPS pausado y voz detenida.';
    });

    // Trazado de ruta con OSRM Routing Machine
    function trazarRuta(origen, destino) {
      if (routingControl) map.removeControl(routingControl);

      routingControl = L.Routing.control({
        waypoints: [origen, destino],
        router: L.Routing.osrmv1({ serviceUrl: 'https://router.project-osrm.org/route/v1' }),
        lineOptions: { styles: [{ color: '#007acc', opacity: 0.8, weight: 6 }] },
        show: true,
        addWaypoints: false,
        draggableWaypoints: false,
        fitSelectedRoutes: true
      }).addTo(map);

      statusBox.textContent = `🎙️ Ruta iniciada hacia el destino.`;
    }

    function cancelarRuta() {
      if (routingControl) {
        map.removeControl(routingControl);
        routingControl = null;
      }
      if (routeLayer) map.removeLayer(routeLayer);
      window.lastTarget = null;
      statusBox.textContent = 'Ruta cancelada.';
    }

    function startJourneyTo(lat, lon, label) {
      const destino = L.latLng(lat, lon);
      window.lastTarget = destino;
      lastSpokenInstruction = '';
      speak("Iniciando ruta hacia " + label);

      if (!currentCoords) {
        statusBox.textContent = 'Activando GPS para calcular ruta...';
        document.getElementById('locateBtn').click();
        setTimeout(() => {
          if (currentCoords) trazarRuta(L.latLng(currentCoords[0], currentCoords[1]), destino);
        }, 2000);
      } else {
        trazarRuta(L.latLng(currentCoords[0], currentCoords[1]), destino);
      }
    }

    // Mostrar marcadores filtrados de la base de datos
    function mostrarMarcadores(datos) {
      markersLayer.clearLayers();
      datos.forEach(item => {
        const popupContent = `
          <b>${item.calle}</b><br>
          Barrio: ${item.barrio}<br>
          <button class="btn-ruta" onclick="iniciarNavegacionBD(${item.lat}, ${item.lng}, '${item.calle}')">🚀 Navegar</button>
        `;
        L.marker([item.lat, item.lng]).addTo(markersLayer).bindPopup(popupContent);
      });
    }

    function iniciarNavegacionBD(lat, lng, calle) {
      startJourneyTo(lat, lng, calle);
    }

    function filtrarUbicaciones() {
      const b = document.getElementById('filter-barrio').value.toLowerCase().trim();
      const c = document.getElementById('filter-calle').value.toLowerCase().trim();

      const filtrados = baseDeDatos.filter(item => {
        const coincideBarrio = item.barrio.toLowerCase().includes(b);
        const coincideCalle = item.calle.toLowerCase().includes(c);
        return coincideBarrio && coincideCalle;
      });

      mostrarMarcadores(filtrados);
      statusBox.textContent = `Mostrando ${filtrados.length} resultados de la base de datos.`;
      
      if (filtrados.length === 1) {
        map.setView([filtrados[0].lat, filtrados[0].lng], 16);
      }
    }

    // Tocar el mapa directamente
    map.on('click', (e) => {
      const { lat, lng } = e.latlng;
      if (targetMarker) map.removeLayer(targetMarker);

      const popupContent = document.createElement('div');
      popupContent.innerHTML = `<b>Punto seleccionado</b><br><span style="font-size:11px; color:#aaa;">${lat.toFixed(5)}, ${lng.toFixed(5)}</span><br>`;
      
      const journeyBtn = document.createElement('button');
      journeyBtn.className = 'btn-ruta';
      journeyBtn.textContent = '🚀 Iniciar viaje hasta aquí';
      journeyBtn.onclick = () => {
        startJourneyTo(lat, lng, 'el punto seleccionado');
        targetMarker.closePopup();
      };
      popupContent.appendChild(journeyBtn);

      targetMarker = L.marker([lat, lng]).addTo(map).bindPopup(popupContent).openPopup();
    });

    // BÚSQUEDA GENERAL (GeoRef AR -> Nominatim)
    async function searchAddress() {
      const query = document.getElementById('address').value.trim();
      if (!query) {
        statusBox.textContent = 'Escribí una calle y altura (ej. 25 de Mayo 150).';
        return;
      }

      statusBox.textContent = `Buscando "${query}" en Formosa...`;
      let found = null;

      try {
        const georefUrl = new URL('https://apis.datos.gob.ar/georef/api/direcciones');
        georefUrl.searchParams.set('direccion', query);
        georefUrl.searchParams.set('provincia', 'Formosa');
        georefUrl.searchParams.set('departamento', 'Formosa');
        georefUrl.searchParams.set('max', '1');

        const res = await fetch(georefUrl);
        if (res.ok) {
          const data = await res.json();
          if (data.direcciones && data.direcciones.length > 0) {
            const item = data.direcciones[0];
            if (item.ubicacion?.lat) {
              found = { lat: item.ubicacion.lat, lon: item.ubicacion.lon, name: item.nomenclatura };
            }
          }
        }
      } catch (e) { console.warn(e); }

      // Fallback a Nominatim si GeoRef no responde
      if (!found) {
        try {
          const nomUrl = `https://nominatim.openstreetmap.org/search?format=jsonv2&q=${encodeURIComponent(query + ', Formosa, Argentina')}&countrycodes=ar&limit=1`;
          const res = await fetch(nomUrl, { headers: { 'Accept-Language': 'es' } });
          if (res.ok) {
            const results = await res.json();
            if (results.length > 0) {
              found = { lat: parseFloat(results[0].lat), lon: parseFloat(results[0].lon), name: results[0].display_name };
            }
          }
        } catch (e) { console.warn(e); }
      }

      if (!found) {
        statusBox.textContent = '❌ No se encontró la dirección exacta. Probá tocando en el mapa.';
        return;
      }

      if (targetMarker) map.removeLayer(targetMarker);
      targetMarker = L.marker([found.lat, found.lon]).addTo(map)
        .bindPopup(`<b>${found.name}</b><br><button class="btn-ruta" onclick="startJourneyTo(${found.lat}, ${found.lon}, '${found.name}')">🚀 Navegar</button>`)
        .openPopup();
      
      map.setView([found.lat, found.lon], 17);
      statusBox.textContent = `📍 Encontrado: ${found.name}`;
    }

    document.getElementById('searchBtn').addEventListener('click', searchAddress);
    document.getElementById('address').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') searchAddress();
    });

    // Inicializar visualización de base de datos por defecto
    mostrarMarcadores(baseDeDatos);
  </script>
</body>
</html>
