<!DOCTYPE html>
<html>
<head>
  <title>Navegador Argenmap</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Estilos y Scripts de Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <!-- Plugin de Ruteo (Leaflet Routing Machine) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
  <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>

  <style>
    #map { height: 100vh; width: 100vw; margin: 0; padding: 0; }
    body { margin: 0; }
  </style>
</head>
<body>

<div id="map"></div>

<script>
  // 1. Inicializar mapa centrado en coordenadas
  var map = L.map('map').setView([-26.1783, -58.1857], 15);

  // 2. Capa base oficial de Argenmap (IGN)
  var argenmap = L.tileLayer('https://wms.ign.gob.ar/geoserver/gwc/service/tms/1.0.0/capasbase:argenmap_gris@EPSG%3A3857@png/{z}/{x}/{y}.png', {
    tms: true,
    maxZoom: 18,
    attribution: '&copy; <a href="https://www.ign.gob.ar/">IGN Argentina</a>'
  }).addTo(map);

  // 3. Trazar ruta entre Punto A y Punto B sobre el mapa del IGN
  L.Routing.control({
    waypoints: [
      L.latLng(-26.1783, -58.1857), // Punto de origen (Ej. Formosa)
      L.latLng(-26.1850, -58.1750)  // Punto de destino
    ],
    routeWhileDragging: true,
    language: 'es'
  }).addTo(map);
</script>

</body>
</html>
