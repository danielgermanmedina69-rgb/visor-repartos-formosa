<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa y Navegador - Formosa</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Leaflet Routing Machine CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    #control-panel {
      padding: 15px;
      background: #f4f4f4;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      z-index: 1000;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    input[type="text"] {
      padding: 8px;
      font-size: 14px;
      width: 250px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      padding: 8px 15px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background-color: #0056b3;
    }
    #statusBox {
      font-size: 14px;
      color: #333;
      font-weight: bold;
    }
    #map {
      flex-grow: 1;
      width: 100%;
    }
  </style>
</head>
<body>

  <div id="control-panel">
    <input type="text" id="address" placeholder="Ej: San Martín 500" />
    <button onclick="searchAddress()">Buscar y Navegar</button>
    <span id="statusBox">Escribí una calle y una altura en Formosa.</span>
  </div>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Leaflet Routing Machine JS -->
  <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>

  <script>
    // 1. Inicializar el mapa centrado en Formosa Capital por defecto
    const map = L.map('map').setView([-26.184, -58.175], 14);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let routingControl = null;

    // 2. Función principal de búsqueda y ruteo
    async function searchAddress() {
      const inputEl = document.getElementById('address');
      const statusBox = document.getElementById('statusBox');

      const q = inputEl.value.trim();

      if (!q) {
        statusBox.textContent = 'Escribí una calle y una altura.';
        return;
      }

      statusBox.textContent = 'Buscando dirección en Formosa...';

      let found = null;

      // Primera fuente: OpenStreetMap (Nominatim)
      try {
        const url = new URL('https://nominatim.openstreetmap.org/search');
        url.searchParams.set('format', 'jsonv2');
        url.searchParams.set('q', q + ', Formosa, Argentina');
        url.searchParams.set('countrycodes', 'ar');
        url.searchParams.set('limit', '1');

        const response = await fetch(url, {
          headers: { 
            'Accept-Language': 'es',
            'User-Agent': 'AppNavegacionFormosa/1.0'
          }
        });

        if (response.ok) {
          const results = await response.json();
          if (results.length > 0) {
            const r = results[0];
            found = {
              lat: Number(r.lat),
              lon: Number(r.lon),
              name: r.display_name
            };
          }
        }
      } catch (e) {
        console.log('Primera búsqueda no disponible', e);
      }

      // Segunda fuente: Photon (si la primera falló)
      if (!found) {
        try {
          const url = new URL('https://photon.komoot.io/api/');
          url.searchParams.set('q', q + ', Formosa, Argentina');
          url.searchParams.set('lat', '-26.184');
          url.searchParams.set('lon', '-58.175');
          url.searchParams.set('limit', '1');
          url.searchParams.set('lang', 'es');

          const response = await fetch(url);

          if (response.ok) {
            const data = await response.json();
            if (data.features && data.features.length > 0) {
              const feature = data.features[0];
              const coords = feature.geometry.coordinates;

              found = {
                lat: Number(coords[1]),
                lon: Number(coords[0]),
                name: feature.properties.name || feature.properties.street || q
              };
            }
          }
        } catch (e) {
          console.log('Segunda búsqueda no disponible', e);
        }
      }

      // Validar si se encontró
      if (!found || !Number.isFinite(found.lat) || !Number.isFinite(found.lon)) {
        statusBox.textContent = 'No encontramos esa dirección. Probá con otra.';
        return;
      }

      statusBox.textContent = 'Obteniendo tu ubicación actual para trazar la ruta...';

      // 3. Obtener ubicación actual del usuario por GPS y trazar la ruta
      if (!navigator.geolocation) {
        alert('Tu navegador no soporta geolocalización.');
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const userLat = position.coords.latitude;
          const userLon = position.coords.longitude;

          statusBox.textContent = '¡Ruta trazada hacia el destino!';

          // Si ya existía una ruta anterior, la removemos del mapa
          if (routingControl) {
            map.removeControl(routingControl);
          }

          // Crear la ruta usando Leaflet Routing Machine
          routingControl = L.Routing.control({
            waypoints: [
              L.latLng(userLat, userLon),     // Origen (Tu posición GPS)
              L.latLng(found.lat, found.lon)  // Destino (Dirección buscada)
            ],
            routeWhileDragging: false,
            language: 'es',
            showAlternatives: false,
            fitSelectedRoutes: true,
            lineOptions: {
              styles: [{ color: '#007bff', opacity: 0.8, weight: 6 }]
            }
          }).addTo(map);

        },
        (error) => {
          statusBox.textContent = 'No se pudo obtener tu ubicación GPS.';
          console.error(error);
        },
        { enableHighAccuracy: true }
      );
    }
  </script>
</body>
</html>
