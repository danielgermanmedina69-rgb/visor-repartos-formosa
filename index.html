<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Logística Dark Mode</title>
    <style>
        body { margin: 0; padding: 0; background-color: #121212; color: #e0e0e0; font-family: sans-serif; }
        #control-panel { padding: 15px; background: #1e1e1e; display: flex; gap: 10px; flex-wrap: wrap; }
        input, select, button { background: #2d2d2d; color: #fff; border: 1px solid #444; padding: 8px; border-radius: 4px; }
        button { cursor: pointer; background: #007acc; border: none; }
        button:hover { background: #0098ff; }
        #map { height: calc(100vh - 60px); width: 100%; }
        .leaflet-popup-content { color: #333; }
    </style>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>

<div id="control-panel">
    <input type="text" id="filter-barrio" placeholder="Filtrar por Barrio...">
    <input type="text" id="filter-calle" placeholder="Filtrar por Calle...">
    <button onclick="filtrarUbicaciones()">Buscar</button>
    <span id="resultado-info"></span>
</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const map = L.map('map').setView([-26.1852, -58.1751], 13);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; CARTO'
    }).addTo(map);

    let markerPin = null;

    const baseDeDatos = [
        { id: 1, barrio: "Centro", calle: "San Martín 123", lat: -26.1822, lng: -58.1731 },
        { id: 2, barrio: "Don Bosco", calle: "Belgrano 456", lat: -26.1950, lng: -58.1810 },
        { id: 3, barrio: "Independencia", calle: "Eva Perón 789", lat: -26.1750, lng: -58.1650 }
    ];

    let markersLayer = L.layerGroup().addTo(map);

    function mostrarMarcadores(datos) {
        markersLayer.clearLayers();
        datos.forEach(item => {
            const popupContent = `
                <b>${item.calle}</b><br>Barrio: ${item.barrio}<br>
                <button onclick="fijarPin(${item.lat}, ${item.lng}, '${item.calle.replace(/'/g, "\\'")}')">Seleccionar Destino</button>
            `;
            L.marker([item.lat, item.lng]).addTo(markersLayer)
                .bindPopup(popupContent);
        });
    }

    function filtrarUbicaciones() {
        const b = document.getElementById('filter-barrio').value.toLowerCase();
        const c = document.getElementById('filter-calle').value.toLowerCase();
        const filtrados = baseDeDatos.map(item => {
            const dist = item.distancia || 0;
            let sobrecosto = 0;
            if(dist > 240) sobrecosto = (dist - 240) * 50;
            return { ...item, sobrecosto };
        }).filter(item => {
            const matchB = item.barrio.toLowerCase().includes(b);
            const matchC = item.calle.toLowerCase().includes(c);
            return matchB && matchC;
        });

        mostrarMarcadores(filtrados);
        document.getElementById('resultado-info').innerText = `Mostrando ${filtrados.length} resultados.`;
    }

    function fijarPin(lat, lng, destinoNombre) {
        if (markerPin) map.removeLayer(markerPin);
        
        markerPin = L.marker([lat, lng], {
            icon: L.icon({
                iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png',
                shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
                iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
            })
        }).addTo(map);

        const gmapsLink = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;
        const encodedName = encodeURIComponent(destinoNombre);
        const wazeLink = `https://waze.com/ul?ll=${lat},${lng}&navigate=yes&q=${encodedName}`;

        const pinPopup = `
            <b>Destino Fijado</b><br>
            <a href="${gmapsLink}" target="_blank">Navegar con Google Maps</a><br>
            <a href="${wazeLink}" target="_blank">Navegar con Waze</a>
        `;
        markerPin.bindPopup(pinPopup).openPopup();
        map.setView([lat, lng], 15);
    }

    mostrarMarcadores(baseDeDatos);
</script>
</body>
</html>
