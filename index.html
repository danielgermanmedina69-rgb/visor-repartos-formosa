<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logística y Entregas - Mapa de Reparto</title>
  
  <!-- Leaflet CSS y JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { display: flex; height: 100vh; overflow: hidden; }
    
    #sidebar {
      width: 380px;
      background: #f8fafc;
      border-right: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      z-index: 1000;
      box-shadow: 2px 0 8px rgba(0,0,0,0.05);
    }

    #map { flex: 1; height: 100%; }

    .header { padding: 16px; background: #1e293b; color: white; }
    .header h1 { font-size: 1.1rem; }

    .search-box { padding: 12px; background: white; border-bottom: 1px solid #e2e8f0; }
    .input-group { margin-bottom: 8px; }
    .input-group label { display: block; font-size: 0.75rem; color: #64748b; font-weight: bold; margin-bottom: 2px; }
    .input-group input, .input-group select {
      width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.9rem;
    }

    .btn {
      width: 100%; padding: 10px; background: #2563eb; color: white; border: none;
      border-radius: 6px; font-weight: bold; cursor: pointer; transition: background 0.2s;
    }
    .btn:hover { background: #1d4ed8; }
    .btn-secondary { background: #64748b; margin-top: 5px; }
    .btn-secondary:hover { background: #475569; }

    .deliveries-list { flex: 1; overflow-y: auto; padding: 12px; }
    .delivery-card {
      background: white; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px;
      margin-bottom: 8px; border-left: 4px solid #f59e0b;
    }
    .delivery-card.completed { border-left-color: #10b981; opacity: 0.7; }
    .delivery-card h4 { font-size: 0.95rem; color: #1e293b; }
    .delivery-card p { font-size: 0.8rem; color: #64748b; margin: 2px 0; }
    .card-actions { display: flex; gap: 6px; margin-top: 8px; }
    .card-actions button {
      flex: 1; padding: 4px; font-size: 0.75rem; border-radius: 4px; border: 1px solid #cbd5e1;
      background: #f1f5f9; cursor: pointer;
    }

    /* Responsive para móvil */
    @media (max-width: 768px) {
      body { flex-direction: column-reverse; }
      #sidebar { width: 100%; height: 50%; }
      #map { width: 100%; height: 50%; }
    }
  </style>
</head>
<body>

  <!-- Panel lateral con formulario y lista de entregas -->
  <div id="sidebar">
    <div class="header">
      <h1>📦 Control de Entregas y Rutas</h1>
    </div>

    <div class="search-box">
      <div class="input-group">
        <label>Buscar Calle y Altura o Lugar (Geocodificador):</label>
        <input type="text" id="geoInput" placeholder="Ej: Av. San Martín 1500, Córdoba" />
      </div>
      <button class="btn btn-secondary" onclick="buscarDireccion()">🔍 Localizar en mapa</button>
      
      <hr style="margin: 10px 0; border: none; border-top: 1px dashed #cbd5e1;">

      <div class="input-group">
        <label>Barrio / Zona:</label>
        <input type="text" id="barrioInput" placeholder="Ej: B° Los Álamos" />
      </div>
      <div style="display: flex; gap: 8px;">
        <div class="input-group" style="flex: 1;">
          <label>Manzana / Torre:</label>
          <input type="text" id="manzanaInput" placeholder="Mza 12" />
        </div>
        <div class="input-group" style="flex: 1;">
          <label>Casa / Lote / Dpto:</label>
          <input type="text" id="casaInput" placeholder="Lote 4" />
        </div>
      </div>
      <div class="input-group">
        <label>Destinatario / Paquete:</label>
        <input type="text" id="destinatarioInput" placeholder="Nombre o Tracking ID" />
      </div>

      <button class="btn" onclick="guardarPuntoEntrega()">➕ Agregar Paquete a la Ruta</button>
      <small style="display:block; text-align:center; color:#64748b; font-size:0.7rem; margin-top:4px;">
        *Tip: También puedes hacer clic directo en el mapa para fijar la ubicación exacta.
      </small>
    </div>

    <div class="deliveries-list" id="deliveriesList">
      <!-- Lista dinámica de paquetes -->
    </div>
  </div>

  <!-- Contenedor del Mapa -->
  <div id="map"></div>

  <script>
    // 1. Inicializar Mapa (centrado por defecto en coordenadas estándar, editable a tu ciudad)
    let currentCoords = [-31.4201, -64.1888]; // Coordenadas iniciales (ej. Córdoba/Arg)
    const map = L.map('map').setView(currentCoords, 13);

    // Cargar mapa base de OpenStreetMap
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    let tempMarker = null;
    let entregas = JSON.parse(localStorage.getItem('entregas_db') || '[]');

    // 2. Al hacer clic en el mapa, mover marcador de referencia
    map.on('click', function(e) {
      marcarPuntoTemporal(e.latlng.lat, e.latlng.lng);
    });

    function marcarPuntoTemporal(lat, lng) {
      currentCoords = [lat, lng];
      if (tempMarker) map.removeLayer(tempMarker);
      tempMarker = L.marker([lat, lng], { draggable: true }).addTo(map);
      tempMarker.on('dragend', function(e) {
        currentCoords = [e.target.getLatLng().lat, e.target.getLatLng().lng];
      });
    }

    // 3. Buscar dirección por API pública (Photon / OpenStreetMap)
    async function buscarDireccion() {
      const query = document.getElementById('geoInput').value.trim();
      if (!query) return alert('Ingresa una calle con altura o localidad.');

      try {
        const res = await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(query)}&limit=1`);
        const data = await res.json();
        
        if (data.features && data.features.length > 0) {
          const coords = data.features[0].geometry.coordinates;
          const lat = coords[1];
          const lon = coords[0];
          map.setView([lat, lon], 17);
          marcarPuntoTemporal(lat, lon);
        } else {
          alert('No se encontró la dirección exacta. Ubícala manualmente haciendo clic en el mapa.');
        }
      } catch (err) {
        alert('Error conectando al servicio de geocodificación.');
      }
    }

    // 4. Guardar entrega con datos de Manzana / Barrio
    function guardarPuntoEntrega() {
      const destinatario = document.getElementById('destinatarioInput').value || 'Sin Nombre';
      const barrio = document.getElementById('barrioInput').value;
      const manzana = document.getElementById('manzanaInput').value;
      const casa = document.getElementById('casaInput').value;
      const calle = document.getElementById('geoInput').value;

      const nuevaEntrega = {
        id: Date.now(),
        destinatario,
        calle,
        barrio,
        manzana,
        casa,
        lat: currentCoords[0],
        lng: currentCoords[1],
        completado: false
      };

      entregas.push(nuevaEntrega);
      guardarEnStorage();
      renderizarEntregas();

      // Limpiar campos
      document.getElementById('destinatarioInput').value = '';
      document.getElementById('manzanaInput').value = '';
      document.getElementById('casaInput').value = '';
      if (tempMarker) { map.removeLayer(tempMarker); tempMarker = null; }
    }

    let markersGroup = L.layerGroup().addTo(map);

    // 5. Renderizar lista y marcadores en mapa
    function renderizarEntregas() {
      markersGroup.clearLayers();
      const listContainer = document.getElementById('deliveriesList');
      listContainer.innerHTML = '';

      entregas.forEach((item, index) => {
        // Añadir marcador
        const markerColor = item.completado ? '#10b981' : '#f59e0b';
        const marker = L.circleMarker([item.lat, item.lng], {
          radius: 9,
          fillColor: markerColor,
          color: '#fff',
          weight: 2,
          fillOpacity: 0.9
        }).addTo(markersGroup);

        const infoPopup = `
          <b>${item.destinatario}</b><br>
          ${item.calle ? item.calle + '<br>' : ''}
          ${item.barrio ? '<b>Barrio:</b> ' + item.barrio + '<br>' : ''}
          ${item.manzana ? '<b>Mza:</b> ' + item.manzana : ''} ${item.casa ? '<b>Casa/Lote:</b> ' + item.casa : ''}
        `;
        marker.bindPopup(infoPopup);

        // Tarjeta en barra lateral
        const card = document.createElement('div');
        card.className = `delivery-card ${item.completado ? 'completed' : ''}`;
        card.innerHTML = `
          <h4>${index + 1}. ${item.destinatario}</h4>
          <p>${item.barrio ? 'Barrio: ' + item.barrio + ' | ' : ''} Mza: ${item.manzana || '-'} Lote: ${item.casa || '-'}</p>
          <p>${item.calle || 'Punto fijado en mapa'}</p>
          <div class="card-actions">
            <button onclick="centrarEnMapa(${item.lat}, ${item.lng})">📍 Ver</button>
            <button onclick="abrirNavegadorGps(${item.lat}, ${item.lng})">🚗 Navegar (GPS)</button>
            <button onclick="toggleEstado(${item.id})">${item.completado ? 'Reabrir' : 'Entregado'}</button>
            <button onclick="eliminarEntrega(${item.id})" style="color: red;">✕</button>
          </div>
        `;
        listContainer.appendChild(card);
      });
    }

    function centrarEnMapa(lat, lng) {
      map.setView([lat, lng], 18);
    }

    function abrirNavegadorGps(lat, lng) {
      // Abre Google Maps o Waze con la ruta turn-by-turn hacia las coordenadas exactas de la manzana
      window.open(`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`, '_blank');
    }

    function toggleEstado(id) {
      entregas = entregas.map(e => e.id === id ? { ...e, completado: !e.completado } : e);
      guardarEnStorage();
      renderizarEntregas();
    }

    function eliminarEntrega(id) {
      entregas = entregas.filter(e => e.id !== id);
      guardarEnStorage();
      renderizarEntregas();
    }

    function guardarEnStorage() {
      localStorage.setItem('entregas_db', JSON.stringify(entregas));
    }

    // Inicializar
    renderizarEntregas();
  </script>
</body>
</html>
