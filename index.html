<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navegador Logístico - Formosa</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Leaflet Routing Machine CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    #control-panel {
      padding: 15px;
      background: #f4f4f4;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      z-index: 1000;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    input[type="text"] {
      padding: 10px;
      font-size: 14px;
      width: 280px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      padding: 10px 16px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
    }
    button:hover {
      background-color: #0056b3;
    }
    #statusBox {
      font-size: 14px;
      color: #333;
      font-weight: bold;
      width: 100%;
      margin-top: 5px;
    }
    #map {
      flex-grow: 1;
      width: 100%;
    }
  </style>
</head>
<body>

  <div id="control-panel">
    <input type="text" id="address" placeholder="Ej: Don Bosco 2295 o San Martín" />
    <button onclick="searchAndRoute()">Buscar y Trazar Ruta</button>
    <div id="statusBox">Escribí una calle o dirección en Formosa.</div>
  </div>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Leaflet Routing Machine JS -->
  <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>

  <script>
    // Inicializar mapa centrado en Formosa Capital
    const map = L.map('map').setView([-26.184, -58.175], 14);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let routingControl = null;
    let destinationMarker = null;

    async function buscarCoordenadas(query) {
      // 1. Intentar búsqueda abierta con Nominatim (OpenStreetMap)
      try {
        const url = new URL('https://nominatim.openstreetmap.org/search');
        url.searchParams.set('format', 'jsonv2');
        url.searchParams.set('q', query + ', Formosa, Argentina');
        url.searchParams.set('countrycodes', 'ar');
        url.searchParams.set('limit', '1');

        const response = await fetch(url, { headers: { 'Accept-Language': 'es' } });
        if (response.ok) {
          const data = await response.json();
          if (data.length > 0) {
            return {
              lat: Number(data[0].lat),
              lon: Number(data[0].lon),
              name: data[0].display_name
            };
          }
        }
      } catch (e) {
        console.error('Error en Nominatim:', e);
      }
      return null;
    }

    async function searchAndRoute() {
      const inputEl = document.getElementById('address');
      const statusBox = document.getElementById('statusBox');
      const rawInput = inputEl.value.trim();

      if (!rawInput) {
        statusBox.textContent = 'Por favor, escribí una calle o dirección.';
        return;
      }

      statusBox.textContent = 'Buscando ubicación en Formosa...';

      let found = null;

      // Intento 1: Buscar la dirección tal cual la escribió el usuario
      found = await buscarCoordenadas(rawInput);

      // Intento 2: Si falla (por ejemplo, porque el número de altura no existe), 
      // quitamos los números y buscamos solo el nombre de la calle. ¡Esto evita que falle!
      if (!found) {
        const soloCalle = rawInput.replace(/\d+/g, '').trim();
        if (soloCalle && soloCalle !== rawInput) {
          statusBox.textContent = `Altura exacta no hallada. Buscando la calle: ${soloCalle}...`;
          found = await buscarCoordenadas(soloCalle);
        }
      }

      // Si aun así no encuentra nada
      if (!found || !Number.isFinite(found.lat) || !Number.isFinite(found.lon)) {
        statusBox.textContent = 'No se encontró la calle. Probá con otra denominación (Ej: San Martín).';
        return;
      }

      statusBox.textContent = 'Obteniendo tu ubicación GPS para trazar el camino...';

      // Obtener GPS del dispositivo y trazar ruta
      if (!navigator.geolocation) {
        alert('Tu navegador no soporta geolocalización.');
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const userLat = position.coords.latitude;
          const userLon = position.coords.longitude;

          statusBox.textContent = `¡Ruta trazada hacia: ${found.name}!`;

          // Limpiar ruta anterior si existía
          if (routingControl) {
            map.removeControl(routingControl);
          }

          // Trazar nueva ruta vehicular en el mapa
          routingControl = L.Routing.control({
            waypoints: [
              L.latLng(userLat, userLon),     // Tu posición actual
              L.latLng(found.lat, found.lon)  // Destino encontrado
            ],
            routeWhileDragging: false,
            language: 'es',
            showAlternatives: false,
            fitSelectedRoutes: true,
            lineOptions: {
              styles: [{ color: '#007bff', opacity: 0.8, weight: 6 }]
            }
          }).addTo(map);

        },
        (error) => {
          statusBox.textContent = 'Ubicación encontrada en el mapa (GPS no disponible).';
          map.setView([found.lat, found.lon], 16);
          if (destinationMarker) map.removeLayer(destinationMarker);
          destinationMarker = L.marker([found.lat, found.lon]).addTo(map).bindPopup(found.name).openPopup();
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }
  </script>
</body>
</html>
