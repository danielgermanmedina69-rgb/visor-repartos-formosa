<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navegador Oficial - Formosa</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Leaflet Routing Machine CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    #control-panel {
      padding: 15px;
      background: #f4f4f4;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      z-index: 1000;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    input[type="text"] {
      padding: 8px;
      font-size: 14px;
      width: 250px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      padding: 8px 15px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background-color: #0056b3;
    }
    #statusBox {
      font-size: 14px;
      color: #333;
      font-weight: bold;
    }
    #map {
      flex-grow: 1;
      width: 100%;
    }
  </style>
</head>
<body>

  <div id="control-panel">
    <input type="text" id="address" placeholder="Ej: Don Bosco 2295" />
    <button onclick="searchAddress()">Buscar y Navegar</button>
    <span id="statusBox">Escribí calle y altura (Ej: Don Bosco 2295).</span>
  </div>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Leaflet Routing Machine JS -->
  <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>

  <script>
    const map = L.map('map').setView([-26.184, -58.175], 14);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let routingControl = null;

    async function searchAddress() {
      const inputEl = document.getElementById('address');
      const statusBox = document.getElementById('statusBox');
      const rawInput = inputEl.value.trim();

      if (!rawInput) {
        statusBox.textContent = 'Escribí una calle y una altura.';
        return;
      }

      statusBox.textContent = 'Buscando dirección oficial en Formosa...';

      let found = null;

      // Usar el servicio oficial de geocodificación de ARGENMAP (IGN Argentina)
      try {
        const url = new URL('https://apis.datos.gob.ar/georef/api/direcciones');
        url.searchParams.set('direccion', rawInput);
        url.searchParams.set('provincia', 'Formosa');
        url.searchParams.set('departamento', 'Formosa');
        url.searchParams.set('max', '1');

        const response = await fetch(url);
        if (response.ok) {
          const data = await response.json();
          if (data.direcciones && data.direcciones.length > 0) {
            const d = data.direcciones[0];
            found = {
              lat: d.ubicacion.lat,
              lon: d.ubicacion.lon,
              name: `${d.calle.nombre} ${d.altura.valor}, ${d.localidad.nombre}, Formosa`
            };
          }
        }
      } catch (e) {
        console.error('Error en API Georef Argentina:', e);
      }

      // Si Georef no la encuentra (por ejemplo, si falta el número exacto), intentamos con una búsqueda aproximada de calles del IGN
      if (!found) {
        try {
          const urlCalle = new URL('https://apis.datos.gob.ar/georef/api/calles');
          // Limpiamos los números para buscar la calle genérica
          const soloCalle = rawInput.replace(/\d+/g, '').trim();
          urlCalle.searchParams.set('nombre', soloCalle);
          urlCalle.searchParams.set('provincia', 'Formosa');
          urlCalle.searchParams.set('max', '1');

          const response = await fetch(urlCalle);
          if (response.ok) {
            const data = await response.json();
            if (data.calles && data.calles.length > 0) {
              const c = data.calles[0];
              // Si tiene centroide, usamos coordenadas aproximadas de la calle
              if (c.centroide) {
                found = {
                  lat: c.centroide.lat,
                  lon: c.centroide.lon,
                  name: `${c.nombre} (Zona aproximada), Formosa`
                };
              }
            }
          }
        } catch (e) {
          console.error('Error buscando calle genérica:', e);
        }
      }

      // Validar si se encontró
      if (!found || !Number.isFinite(found.lat) || !Number.isFinite(found.lon)) {
        statusBox.textContent = 'No se encontró la dirección exacta en el registro oficial.';
        return;
      }

      statusBox.textContent = 'Obteniendo tu ubicación GPS para trazar la ruta...';

      if (!navigator.geolocation) {
        alert('Tu navegador no soporta geolocalización.');
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const userLat = position.coords.latitude;
          const userLon = position.coords.longitude;

          statusBox.textContent = '¡Ruta oficial trazada hacia: ' + found.name + '!';

          if (routingControl) {
            map.removeControl(routingControl);
          }

          routingControl = L.Routing.control({
            waypoints: [
              L.latLng(userLat, userLon),
              L.latLng(found.lat, found.lon)
            ],
            routeWhileDragging: false,
            language: 'es',
            showAlternatives: false,
            fitSelectedRoutes: true,
            lineOptions: {
              styles: [{ color: '#28a745', opacity: 0.8, weight: 6 }] // Línea verde oficial
            }
          }).addTo(map);
        },
        (error) => {
          statusBox.textContent = 'Dirección ubicada, pero el GPS no está disponible.';
          map.setView([found.lat, found.lon], 16);
          L.marker([found.lat, found.lon]).addTo(map).bindPopup(found.name).openPopup();
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }
  </script>
</body>
</html>
