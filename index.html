<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa y Navegador - Formosa</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Leaflet Routing Machine CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    #control-panel {
      padding: 15px;
      background: #f4f4f4;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      z-index: 1000;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    input[type="text"] {
      padding: 8px;
      font-size: 14px;
      width: 250px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      padding: 8px 15px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background-color: #0056b3;
    }
    #statusBox {
      font-size: 14px;
      color: #333;
      font-weight: bold;
    }
    #map {
      flex-grow: 1;
      width: 100%;
    }
  </style>
</head>
<body>

  <div id="control-panel">
    <input type="text" id="address" placeholder="Ej: Don Bosco 2295" />
    <button onclick="searchAddress()">Buscar y Navegar</button>
    <span id="statusBox">Escribí una calle y altura en Formosa.</span>
  </div>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Leaflet Routing Machine JS -->
  <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>

  <script>
    const map = L.map('map').setView([-26.184, -58.175], 14);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let routingControl = null;

    // Búsqueda usando Photon (muy veloz y tolerante con calles de Argentina)
    async function queryPhoton(queryStr) {
      try {
        const url = new URL('https://photon.komoot.io/api/');
        url.searchParams.set('q', queryStr);
        url.searchParams.set('lat', '-26.184');
        url.searchParams.set('lon', '-58.175');
        url.searchParams.set('limit', '3');
        url.searchParams.set('lang', 'es');

        const response = await fetch(url);
        if (response.ok) {
          const data = await response.json();
          if (data.features && data.features.length > 0) {
            const feature = data.features[0];
            const coords = feature.geometry.coordinates;
            return {
              lat: Number(coords[1]),
              lon: Number(coords[0]),
              name: feature.properties.name || feature.properties.street || queryStr
            };
          }
        }
      } catch (e) {
        console.error('Error en Photon:', e);
      }
      return null;
    }

    // Búsqueda alternativa usando Nominatim (sin cabeceras prohibidas)
    async function queryNominatim(queryStr) {
      try {
        const url = new URL('https://nominatim.openstreetmap.org/search');
        url.searchParams.set('format', 'jsonv2');
        url.searchParams.set('q', queryStr);
        url.searchParams.set('countrycodes', 'ar');
        url.searchParams.set('limit', '3');

        const response = await fetch(url, {
          headers: { 'Accept-Language': 'es' }
        });

        if (response.ok) {
          const results = await response.json();
          if (results.length > 0) {
            return {
              lat: Number(results[0].lat),
              lon: Number(results[0].lon),
              name: results[0].display_name
            };
          }
        }
      } catch (e) {
        console.error('Error en Nominatim:', e);
      }
      return null;
    }

    async function searchAddress() {
      const inputEl = document.getElementById('address');
      const statusBox = document.getElementById('statusBox');

      const rawInput = inputEl.value.trim();

      if (!rawInput) {
        statusBox.textContent = 'Escribí una calle y una altura.';
        return;
      }

      statusBox.textContent = 'Buscando dirección en Formosa...';

      let found = null;

      // 1. Probar búsqueda completa con Photon primero
      found = await queryPhoton(rawInput + ', Formosa, Argentina');
      
      // 2. Si no encuentra, probar con Nominatim
      if (!found) {
        found = await queryNominatim(rawInput + ', Formosa, Argentina');
      }

      // 3. Si aún no encuentra, quitar los números y buscar solo la calle
      if (!found) {
        const onlyStreet = rawInput.replace(/\d+/g, '').trim();
        if (onlyStreet && onlyStreet !== rawInput) {
          statusBox.textContent = 'Altura exacta no hallada. Buscando la calle...';
          found = await queryPhoton(onlyStreet + ', Formosa, Argentina');
          if (!found) {
            found = await queryNominatim(onlyStreet + ', Formosa, Argentina');
          }
        }
      }

      // Validar si se encontró la ubicación
      if (!found || !Number.isFinite(found.lat) || !Number.isFinite(found.lon)) {
        statusBox.textContent = 'No encontramos esa dirección. Probá escribir solo el nombre de la calle.';
        return;
      }

      statusBox.textContent = 'Obteniendo tu ubicación GPS para trazar la ruta...';

      if (!navigator.geolocation) {
        alert('Tu navegador no soporta geolocalización.');
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const userLat = position.coords.latitude;
          const userLon = position.coords.longitude;

          statusBox.textContent = '¡Ruta trazada hacia el destino!';

          if (routingControl) {
            map.removeControl(routingControl);
          }

          routingControl = L.Routing.control({
            waypoints: [
              L.latLng(userLat, userLon),
              L.latLng(found.lat, found.lon)
            ],
            routeWhileDragging: false,
            language: 'es',
            showAlternatives: false,
            fitSelectedRoutes: true,
            lineOptions: {
              styles: [{ color: '#007bff', opacity: 0.8, weight: 6 }]
            }
          }).addTo(map);
        },
        (error) => {
          statusBox.textContent = 'Dirección ubicada en el mapa (GPS no disponible).';
          map.setView([found.lat, found.lon], 16);
          L.marker([found.lat, found.lon]).addTo(map).bindPopup(found.name).openPopup();
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }
  </script>
</body>
</html>
