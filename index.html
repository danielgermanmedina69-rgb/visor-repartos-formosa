<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navegador Logístico - Formosa</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    #control-panel {
      padding: 15px;
      background: #f4f4f4;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      z-index: 1000;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    input[type="text"] {
      padding: 10px;
      font-size: 15px;
      width: 280px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      padding: 10px 18px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
    }
    button:hover {
      background-color: #218838;
    }
    #statusBox {
      font-size: 14px;
      color: #333;
      font-weight: bold;
      width: 100%;
      margin-top: 5px;
    }
    #map {
      flex-grow: 1;
      width: 100%;
    }
    .leaflet-popup-content-wrapper {
      text-align: center;
      padding: 5px;
    }
  </style>
</head>
<body>

  <div id="control-panel">
    <input type="text" id="address" placeholder="Ej: Don Bosco 2295, Formosa" />
    <button onclick="navegarDireccion()">Navegar Dirección</button>
    <div id="statusBox">Escribí la dirección exacta o esquina y hacé clic en Navegar.</div>
  </div>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Inicializar mapa centrado en Formosa Capital
    const map = L.map('map').setView([-26.184, -58.175], 14);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let currentMarker = null;

    function navegarDireccion() {
      const inputEl = document.getElementById('address');
      const statusBox = document.getElementById('statusBox');
      const rawInput = inputEl.value.trim();

      if (!rawInput) {
        statusBox.textContent = 'Por favor, escribí una dirección.';
        return;
      }

      // Asegurar que la búsqueda siempre incluya Formosa para mayor precisión
      let queryCompleta = rawInput;
      if (!queryCompleta.toLowerCase().includes('formosa')) {
        queryCompleta += ', Formosa, Argentina';
      }

      statusBox.textContent = 'Generando ruta hacia: ' + queryCompleta;

      // Crear enlace directo a Google Maps con la consulta exacta
      // Google Maps resuelve automáticamente las alturas (como Don Bosco 2295) usando su base de datos satelital y catastral
      const googleMapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(queryCompleta)}`;
      const wazeUrl = `https://waze.com/ul?q=${encodeURIComponent(queryCompleta)}&navigate=yes`;

      // Mensaje de éxito con botones directos
      statusBox.innerHTML = `¡Listo! Elegí tu aplicación de navegación para ir a: <b>${rawInput}</b>`;

      // Abrir automáticamente Google Maps en una nueva pestaña (o app si estás en celular)
      window.open(googleMapsUrl, '_blank');
    }
  </script>
</body>
</html>
